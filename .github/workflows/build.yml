name: Build Windows EXE
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
    - run: gradle build
    - name: Create EXE
      shell: bash
      run: |
        jpackage --type app-image --name CalendarApp --input build/libs --main-jar CalendarApp.jar --main-class CalendarApp --java-options "-Dfile.encoding=UTF-8"
    - uses: actions/upload-artifact@v4
      with:
        name: CalendarApp-Windows
        path: CalendarApp/
